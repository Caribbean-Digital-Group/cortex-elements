<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo — cortex-ocr</title>
    <script src="/elements.js"></script>
    <link rel="stylesheet" href="/demo.css" />
    <style>
      .model-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.625rem;
        margin-top: 0.75rem;
      }
      .model-row label {
        font-size: 0.8125rem;
        color: #64748b;
        white-space: nowrap;
        flex-shrink: 0;
      }
      .model-row select {
        flex: 1;
        background: #0f172a;
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 0.5rem;
        color: #f1f5f9;
        font-family: 'Menlo', 'Consolas', monospace;
        font-size: 0.8125rem;
        padding: 0.4rem 0.625rem;
        min-width: 0;
        transition: border-color 0.15s;
      }
      .model-row select:focus { outline: none; border-color: #06b6d4; }
    </style>
  </head>
  <body>
    <nav class="demo-nav">
      <a href="/">← Índice</a>
      <span class="badge">cortex-ocr</span>
    </nav>

    <h1 class="demo-title">cortex-ocr</h1>
    <p class="demo-subtitle">Extrae y valida datos de INE, CURP, CFDI y Constancia de Situación Fiscal</p>

    <!-- Config card -->
    <div class="token-card">
      <label class="token-card__label" for="token-input">API Token</label>
      <div class="token-card__row">
        <textarea
          id="token-input"
          rows="3"
          placeholder="ck_live_..."
          spellcheck="false"
          autocomplete="off"
        ></textarea>
        <button class="token-card__btn" id="apply-btn">Aplicar</button>
      </div>

      <div class="token-card__url">
        <span class="token-card__url-label">API URL</span>
        <input
          id="api-url-input"
          type="url"
          placeholder="http://localhost:8000  (vacío = VITE_CORTEX_API_URL del build)"
          spellcheck="false"
          autocomplete="off"
        />
      </div>

      <!-- Document options -->
      <div class="model-row">
        <label for="doc-type">Documento</label>
        <select id="doc-type">
          <option value="auto">Auto-detectar</option>
          <option value="ine">INE</option>
          <option value="curp">CURP</option>
          <option value="cfdi">CFDI (imagen, PDF o XML)</option>
          <option value="csf">Constancia de Situación Fiscal</option>
        </select>
        <label for="sides">Lados (INE)</label>
        <select id="sides">
          <option value="front">Solo anverso</option>
          <option value="both">Anverso y reverso</option>
        </select>
        <label for="engine">Motor</label>
        <select id="engine">
          <option value="auto">Auto (Mistral → GLM)</option>
          <option value="mistral">Mistral OCR</option>
          <option value="glm">GLM-OCR</option>
        </select>
        <label for="theme">Tema</label>
        <select id="theme">
          <option value="dark">Oscuro</option>
          <option value="light">Claro</option>
        </select>
      </div>

      <p id="token-status" class="token-card__status"></p>
    </div>

    <!-- Element — shown only after token is applied -->
    <div id="element-wrapper" class="element-wrapper">
      <cortex-ocr id="ocr" mode="both"></cortex-ocr>
    </div>

    <p class="result-label">Resultado</p>
    <pre id="output">El resultado aparecerá aquí después de procesar un documento.</pre>

    <script type="module">
      import { initDemo } from '/demo.js'

      const output = document.getElementById('output')
      const el = document.getElementById('ocr')
      const options = ['doc-type', 'sides', 'engine', 'theme']
      const attrs = { 'doc-type': 'document-type', sides: 'sides', engine: 'engine', theme: 'theme' }

      // Restaurar y aplicar opciones guardadas
      for (const id of options) {
        const input = document.getElementById(id)
        const saved = localStorage.getItem(`cortex_demo_ocr_${id}`)
        if (saved) input.value = saved
        el.setAttribute(attrs[id], input.value)
        input.addEventListener('change', () => {
          localStorage.setItem(`cortex_demo_ocr_${id}`, input.value)
          el.setAttribute(attrs[id], input.value)
        })
      }

      initDemo({
        elementId: 'ocr',
        onApply(el) {
          el.onResult = (data) => {
            output.textContent = JSON.stringify(data, null, 2)
          }
          el.addEventListener('cortex:error', (e) => {
            output.textContent = 'Error:\n' + JSON.stringify(e.detail, null, 2)
          })
          el.addEventListener('cortex:loading', (e) => {
            if (e.detail.loading) output.textContent = 'Procesando...'
          })
        },
      })
    </script>
  </body>
</html>
